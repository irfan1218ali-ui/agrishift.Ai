[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agrishift-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
geospatial = ["rasterio>=1.4,<2", "netCDF4>=1.7,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
dev = ["ruff>=0.6,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
