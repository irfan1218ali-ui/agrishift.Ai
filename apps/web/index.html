<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>AgriShift AI</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font:16px/1.6 system-ui,sans-serif}
      main{width:min(520px,calc(100% - 40px));padding:32px;border:1px solid #dbe3e9;border-radius:16px;background:#fff}
      h1{margin:0 0 10px;font-size:26px;letter-spacing:-.04em}p{color:#526174}a{display:inline-flex;min-height:44px;align-items:center;border-radius:12px;background:#166534;padding:0 18px;color:#fff;font-weight:700;text-decoration:none}
    </style>
    <script>if(location.port==="8000")location.replace(`${location.protocol}//${location.hostname}:3000`)</script>
  </head>
  <body><main><h1>AgriShift AI Version 2</h1><p>The Next.js farmer interface is running separately from the analysis API.</p><a href="http://127.0.0.1:3000">Open AgriShift AI</a></main></body>
</html>
